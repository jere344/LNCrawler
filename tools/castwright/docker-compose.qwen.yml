# Qwen3-TTS variant for the GTX 1080 PC (8 GB VRAM, 32 GB RAM):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.qwen.yml ...
services:
  castwright:
    build:
      args:
        QWEN: "1"
        HZ: ${HZ:-1}
    image: lncrawler-cwbench:qwen
    environment:
      # Pascal has no bf16 and runs fp16 at 1/64 speed: load Qwen in fp32.
      QWEN_DTYPE: float32
      HF_HOME: /models/hf
      # 1.7B tier through hz-gguf (torch when QWEN_17B_BACKEND=torch).
      QWEN_17B_BACKEND: ${QWEN_17B_BACKEND:-hz}
      # hz plus a Kokoro arena do not fit on 8 GB. Kokoro only speaks the minor characters, so it runs on the CPU.
      KOKORO_DEVICE: ${KOKORO_DEVICE:-cpu}
      QWEN_HZ_MODEL_DIR: /hz/model-base/q8
      QWEN_HZ_DECODER_CHUNK: ${QWEN_HZ_DECODER_CHUNK:-48}
      # hz runs small numpy matrix products every frame. OpenBLAS starts one thread per host core (12) inside a
      # 6-CPU container and they fight: one thread renders ~60% faster (5.7x -> 8.6x realtime on a real chapter).
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      # hz is invisible to the sidecar's torch metric and its long batches peak with under 100 MB free on the 8 GB card (GTX 1080
      # with a desktop). Each dip under the floor kills the sidecar, so the floor only stops a real out-of-memory.
      SIDECAR_VRAM_FREE_FLOOR_MB: ${SIDECAR_VRAM_FREE_FLOOR_MB:-50}
      # VoiceDesign fp32 peaks at ~7.75 GB reserved, just over the default soft threshold (7731 MB). The soft
      # flag latches until the process restarts, so the next render waited 210 s and then force-recycled.
      SIDECAR_VRAM_RECYCLE_SOFT_MB: ${SIDECAR_VRAM_RECYCLE_SOFT_MB:-8200}
      # Patch 19: bound Kokoro's ONNX Runtime CUDA arena (it otherwise fills the card next to the desktop).
      KOKORO_ORT_GPU_MEM_MB: ${KOKORO_ORT_GPU_MEM_MB:-3072}
      # Patch 6: 1.7B live-instruct batches run on hz and drop the per-line instruct; "torch" restores the old routing.
      QWEN_HZ_INSTRUCT: ${QWEN_HZ_INSTRUCT:-ignore}
      # The sidecar's capacity admission picks a GPU by estimated footprint. With one card it has nothing to choose
      # and only refuses: it never sees the hz backend's memory (so a loaded hz model looks like 6 GB still to find),
      # and its learned VoiceDesign peak (~7.4 GB) never fits next to the Windows desktop. The hard VRAM ceilings and
      # the sequential design patches still guard the card.
      SEG_CAPACITY_ADMISSION: ${SEG_CAPACITY_ADMISSION:-0}
    volumes:
      # Qwen weights (~5 GB), downloaded on first use, kept across rebuilds.
      - models:/models
      # hz-gguf export (one-time, see README). Must exist before `up`.
      - cwbench-lab-hz-base:/hz/model-base
    # The fp32 load materialises the 1.7B design model in RAM first (~7 GB).
    mem_limit: ${CW_MEM_LIMIT:-16g}
    cpus: ${CW_CPUS:-6}

volumes:
  models:
  cwbench-lab-hz-base:
    external: true
