# Crawlers and social scrapers get the server-rendered SEO pages instead of the
# client-side SPA shell. Browser clients keep the SPA.
#
# This is the baked baseline. It is refreshed daily by update-render-seo-map.sh,
# which overwrites /etc/nginx/conf.d/00-render-seo-map.conf with the union of
# these tokens and the maintained list from ai.robots.txt. The 00- prefix is
# required so this map is parsed before default.conf.
map $http_user_agent $render_seo {
    default "";
    "~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|applebot|petalbot|seznambot|bytespider|sogou|exabot|ia_archiver|semrushbot|ahrefsbot|mj12bot|dotbot|rogerbot|screaming frog|gptbot|oai-searchbot|oai-adsbot|chatgpt-user|claudebot|claude-web|claude-user|claude-searchbot|anthropic-ai|perplexitybot|perplexity-user|ccbot|google-extended|googleother|google-inspectiontool|amazonbot|meta-externalagent|facebookexternalhit|twitterbot|discordbot|linkedinbot|slackbot|telegrambot|whatsapp|pinterestbot|redditbot|embedly|quora link preview|skypeuripreview|vkshare|w3c_validator|bitlybot|tumblr|iframely|mistralai-user|duckassistbot|google-cloudvertexbot)" "1";
}
