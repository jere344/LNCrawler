# Forwarded headers for the proxied API and frontend locations.
# Included from nginx.conf.template (copied to /etc/nginx/snippets/ by the Dockerfile).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# nginx's crawler map result ("1" for known bots). Empty means the header is not
# sent, and setting it always overrides any client-supplied value.
proxy_set_header X-Render-Seo $render_seo;
