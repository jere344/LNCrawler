services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 128mb
    # Bounded for a ~2GB DB on a small host. The old config let each of 3
    # autovacuum workers inherit maintenance_work_mem=128MB (autovacuum_work_mem
    # default -1) and top out near 500MB. See autovacuum_work_mem below.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - autovacuum_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=0
    mem_limit: 768m
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./lncrawler-api
    restart: unless-stopped
    volumes: &api-volumes
      - ./lncrawler-api:/app/lncrawler-api
      - ./Lightnovels:/app/Lightnovels
      - ./imports:/app/imports
      - ./lncrawler-api/logs:/app/lncrawler-api/logs
      - ./lncrawler-crawler:/app/lncrawler-crawler
    environment: &api-env
      SITE_URL: ${SITE_URL}
      SITE_API_URL: ${SITE_API_URL}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_ISSUES_ENABLED: ${GITHUB_ISSUES_ENABLED}
      ISSUE_REPORTS_TO_DISK: ${ISSUE_REPORTS_TO_DISK}
      ISSUE_REPORTS_DIR: ${ISSUE_REPORTS_DIR}
      LNCRAWL_OUTPUT_PATH: /app/Lightnovels
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/lncrawler-api/start.sh"]

  # Job workers: identical any-job workers that atomically claim from the DB
  # queue. Scale with usage: set CRAWLER_REPLICAS in .env, or run
  #   docker compose up -d --scale crawler=N
  crawler:
    build: ./lncrawler-api
    restart: unless-stopped
    # tini as PID 1 (reaps orphaned Chromium grandchildren from job subprocesses).
    init: true
    # Hard cap so a runaway job/leak OOM-kills a crawler, not the host.
    # Sized for CRAWLER_CONCURRENCY jobs (each job is its own subprocess).
    mem_limit: ${CRAWLER_MEM_LIMIT:-2g}
    deploy:
      replicas: ${CRAWLER_REPLICAS:-1}
    volumes: *api-volumes
    environment:
      <<: *api-env
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-5}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["sh", "/app/lncrawler-api/start_crawler.sh"]

  # Background harvest feeder: discovers novels and queues download jobs onto
  # the crawler queue. Always up; toggled on/off from the admin (HarvestConfig).
  harvest:
    build: ./lncrawler-api
    restart: unless-stopped
    volumes: *api-volumes
    environment: *api-env
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["sh", "/app/lncrawler-api/start_harvest.sh"]

  scheduler:
    build: ./lncrawler-api
    restart: unless-stopped
    volumes: *api-volumes
    environment: *api-env
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["sh", "/app/lncrawler-api/start_scheduler.sh"]

  frontend:
    build:
      context: ./lncrawler-frontend
      args:
        - VITE_API_BASE_URL=${SITE_API_URL}
    restart: unless-stopped
    depends_on:
      - api

  nginx-proxy:
    build: ./nginx-proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"  # The main entry point
    volumes:
      - ./lncrawler-api/static:/static
      - ./lncrawler-api/media:/media
      - ./lncrawler-api/logs:/logs
      - ./Lightnovels:/lightnovels
    environment:
      - SITE_URL=${SITE_URL}
      - SITE_API_URL=${SITE_API_URL}
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
