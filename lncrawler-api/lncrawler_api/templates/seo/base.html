<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{% if keywords %}<meta name="keywords" content="{{ keywords }}">{% endif %}
<link rel="canonical" href="{{ canonical }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:site_name" content="LNCrawler">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ og_image }}">
<script type="application/ld+json">{{ jsonld|safe }}</script>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:#1b1b1f;background:#faf8ff}
header,footer{background:#1b1030;color:#e9e0f5;padding:14px 20px}
header a{color:#e9e0f5;text-decoration:none;font-weight:700;font-size:1.2rem}
main{max-width:900px;margin:0 auto;padding:24px 20px 64px}
h1{font-size:1.7rem;line-height:1.25}
h2{font-size:1.25rem;margin-top:2rem}
a{color:#5a2ea6}
ul.sources{list-style:none;padding:0}
ul.sources li{padding:10px 0;border-bottom:1px solid #e4dcf3}
ol.chapters{list-style:none;padding:0}
ol.chapters li{padding:6px 0;border-bottom:1px solid #ece6f7}
.chapter-body img{max-width:100%;height:auto}
.meta{color:#5c5470;font-size:.92rem}
.tags span{display:inline-block;background:#ece4fb;border-radius:12px;padding:2px 10px;margin:3px 4px 0 0;font-size:.82rem}
footer{font-size:.85rem}
footer a{color:#c9b6ea}
</style>
</head>
<body>
<header><a href="{{ site_url }}/">LNCrawler</a></header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
<p>Read light novels online on <a href="{{ site_url }}/">LNCrawler</a>. <a href="{{ site_url }}/novels/search">Search</a></p>
</footer>
</body>
</html>
